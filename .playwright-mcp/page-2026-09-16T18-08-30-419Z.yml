          - img "جورج بوش" [ref=e148]
          - paragraph [ref=e149]: به گزارش تابناک، اندیشکده آمریکایی استیمسون (Stimson) در مقاله‌ای به قلم باربارا اسلیوین (Barbara Slavin) از تجربیات نویسنده در سفر دسامبر سال ۲۰۰۱ به ایران می‌گوید.
          - paragraph [ref=e150]: به اعتقاد نویسنده، این سفر در شاید مساعدترین زمان برای یک تنش‌زدایی ابتدایی بین واشنگتن و تهران انجام شد.
          - paragraph [ref=e151]:
            - strong [ref=e152]: روایت این نویسنده از این سفرها در ادامه آمده است. لازم به ذکر است موارد مطرح شده از سوی نویسنده به معنای تایید آنها از سوی تابناک نیست.
          - paragraph [ref=e153]: بیست و پنج سال پس از آنکه القاعده با حملاتی هولناک بیش از ۳۰۰۰ آمریکایی را به کشتن داد و باعث شکل‌گیری «جنگ علیه تروریسم» شد، آمریکا درگیر جنگی خونین با ایران است که مملو از «چه می‌شدهای» تاریخی است.
          - link "آکادمی شنا" [ref=e156] [cursor=pointer]:
            - /url: https://www.tabnak.ir/fa/ads/redirect/a/13293
            - img "آکادمی شنا" [ref=e157]
          - paragraph [ref=e158]: درست پس از ۱۱ سپتامبر، ایران به دولت بوش کمک کرد تا رژیم طالبان را که پناهگاه القاعده بود سرنگون کرده و دولت جدیدی را جایگزین آن کند. ایران که کشوری با اکثریت مسلمان شیعه است، در سال ۱۹۹۸ و پس از آنکه طالبان دیپلمات‌های ایرانی را در شهر عمدتاً شیعه‌نشین مزارشریف به قتل رساند، تا آستانهٔ جنگ با طالبان سنی‌مذهب پیش رفته بود.
          - paragraph [ref=e159]: اما نومحافظه‌کاران در دولت بوش اصرار داشتند که ایران در کنار عراق و کرهٔ شمالی، در سخنرانی وضعیت کشور جورج دبلیو بوش در سال ۲۰۰۲، در «محور شرارت» گنجانده شود.
          - paragraph [ref=e160]: پیام ضمنی این بود که ایران در نهایت باید برای ضربات متعدد خود به آمریکایی‌ها از زمان انقلاب ۱۹۷۹، حمایت از گروه‌هایی که آمریکا آنها را تروریست می‌نامد، و پیشرفت تازه‌افشا شده‌اش در حوزهٔ هسته‌ای، هزینه بپردازد.
          - paragraph [ref=e161]: با این حال، پیش و پس از ۱۱ سپتامبر، فرصت‌هایی برای تغییر مسیر دشمنی آمریکا و ایران وجود داشت. حتی یک توافق در سال ۲۰۱۵ - برنامه جامع اقدام مشترک (برجام) - وجود داشت که توسط آمریکا، بریتانیا، فرانسه، روسیه، چین و آلمان مذاکره شد و مورد تأیید شورای امنیت سازمان ملل قرار گرفت، اما در دورهٔ اول ریاست‌جمهوری ترامپ به طور یک‌جانبه لغو شد.
          - heading [level=2] [ref=e162]:
            - strong [ref=e163]: مساعدترین زمان برای تنش زدایی ایران و آمریکا کی بود؟
          - paragraph [ref=e164]: با این حال، به اعتقاد این تحلیلگر، مساعدترین زمان برای دستیابی به یک تنش‌زدایی ابتدایی با ایران، چند سال اول پس از ۱۱ سپتامبر بود؛ زمانی که حتی مخالفان سرسخت آمریکا، اقدام نظامی این کشور علیه طالبان را موجه می‌دانستند، و نیروی قدس ایران اطلاعاتی را در اختیار داشت که به نیرو‌های آمریکایی برای تصرف کابل کمک کرد.
          - paragraph [ref=e165]: در آن زمان، آمریکا هنوز تنها ابرقدرت جهان بود؛ روسیه هنوز در حال بهبودی از فروپاشی شوروی بود و چین هنوز به غول اقتصادی امروز تبدیل نشده بود. ایران رئیس‌جمهوری اصلاح‌طلب به نام محمد خاتمی داشت که به دنبال روابط بهتر با غربی بود که در آن زمان به نظر می‌رسید رو به تعالی است.
          - paragraph [ref=e166]: من (باربارا اسلیوین) در دسامبر ۲۰۰۱، یک ماه پس از سقوط طالبان به دست نیرو‌های آمریکایی و ائتلاف شمال تحت حمایت ایران، به عنوان روزنامه‌نگار از ایران بازدید کردم. در میان ۹ سفری که در ۳۰ سال گذشته به ایران داشته‌ام، این سفر برجسته است.
          - heading [level=3] [ref=e167]:
            - strong [ref=e168]: همدردی ایرانیان با قربانیان حادثه 11 سپتامبر 2001
          - paragraph [ref=e169]: ایرانیانی از تمام اقشار جامعه از جمله نمایندگان مجلس، با قربانیان ۱۱ سپتامبر ابراز همدردی می‌کردند و از بهبود روابط سخن می‌گفتند. شرکت کوکاکولا تازه بطری‌سازی «مادهٔ واقعی» را در مشهد، برای اولین بار پس از انقلاب، از سر گرفته بود و ایرانیان آن را همراه با کباب خود می‌نوشیدند.
          - paragraph [ref=e170]: "در میان کشور‌های با اکثریت مسلمان، ایران تنها کشوری بود که مردم آن به طور گسترده از آمریکا پس از ۱۱ سپتامبر حمایت کردند. همان‌طور که در دسامبر ۲۰۰۱ نوشتم:"
          - paragraph [ref=e171]: «به مدت سه روز پس از ۱۱ سپتامبر، ده‌ها جوان ایرانی مراسم شب‌زنده‌داری خودجوش با شمع در بلوار میرداماد در شمال تهران برگزار کردند تا با قربانیان آمریکایی حملات تروریستی ابراز همبستگی کنند... بسیاری در اینجا همچنین با حسادت شاهد لغو تحریم‌های اقتصادی پاکستان توسط دولت بوش و برافراشتن پرچم آمریکا بر فراز سفارت سابق این کشور در کابل در ماه گذشته بودند.»
          - paragraph [ref=e172]: آمریکا و ایران همچنین به مدت ۱۸ ماه پس از ۱۱ سپتامبر، دربارهٔ مسائل مربوط به افغانستان، اعضای فراری القاعده، و آنچه ایرانی‌ها به درستی حملهٔ قریب‌الوقوع آمریکا به عراق می‌دیدند، مذاکرات مستقیم و محرمانه‌ای در ژنو و پاریس انجام دادند. در مه ۲۰۰۳، همزمان با آنکه رئیس‌جمهور بوش به طور زودهنگام «ماموریت انجام شد» را در جنگ عراق اعلام می‌کرد، ایران از طریق سفیر وقت سوئیس در تهران، پیشنهادی را به وزارت خارجه آمریکا ارسال کرد برای مذاکرات جامع جهت حل و فصل مسائل حل‌نشده دربارهٔ برنامهٔ هسته‌ای، تروریسم، و مناقشهٔ اسرائیل-فلسطین. همان‌طور که در کتاب خود در سال ۲۰۰۷ با عنوان «دوستان تلخ، دشمنان صمیمی» نوشتم، دولت بوش این پیشنهاد را به عنوان یک بادسنج آزمایشی تلقی کرد و هیچ پاسخی به آن نداد.
          - paragraph [ref=e173]: بی‌توجهی آمریکا، اردوگاه اصلاح‌طلبان در ایران که برای گفت‌و‌گو فشار می‌آوردند را بیشتر بی‌اعتبار ساخت. این امر، آیت‌الله علی خامنه‌ای، رهبر وقت ایران را تشویق کرد تا در انتخابات ریاست‌جمهوری سال ۲۰۰۵ از محافظه کاران حمایت کند.
          - paragraph [ref=e174]: با این حال، حتی در درون آن اردوگاه نیز کسانی بودند که دو دهه پیش به دنبال ارتباط با واشنگتن بودند.
          - heading [level=3] [ref=e175]:
            - strong [ref=e176]: «محسن رضایی» حامی از سرگیری روابط دیپلماتیک با آمریکا
          - paragraph [ref=e177]: محسن رضایی، فرماندهٔ باسابقهٔ سپاه پاسداران انقلاب اسلامی (IRGC)، اکنون مشاور امنیت ملی ایران است و از زمان ترور سران ارشد ایران توسط اسرائیل در آغاز جنگ، یکی از تأثیرگذارترین چهره‌های نظام محسوب می‌شود.
          - paragraph [ref=e178]: در سال ۲۰۰۵، زمانی که رضایی یکی از چندین تلاش خود برای انتخاب به عنوان رئیس‌جمهور را آغاز کرد، مشاور رسانه‌ای وقت او برای انجام یک مصاحبهٔ ایمیلی با من تماس گرفت.
          - paragraph [ref=e179]: رضایی که به مدت ۱۷ سال فرماندهی سپاه را بر عهده داشت و آن را به نیرویی تبدیل کرد که در طول جنگ ۱۹۸۰-۸۸ با عراق (می جنگید)، دربارهٔ مشکلات اقتصادی ایران صحبت کرد و خواستار همکاری بیشتر با غرب شد.
          - paragraph [ref=e180]:
            - strong [ref=e181]: "او گفت ایران برای گفت‌و‌گو با آمریکا دربارهٔ از سرگیری روابط دیپلماتیک باز است. او نوشت: اگر دولت بوش «پیشنهادی منطقی به ایران ارائه دهد، من معتقدم دگرگونی واقعی در روابط بین ایران و آمریکا رخ خواهد داد.»"
          - paragraph [ref=e182]: در مصاحبه‌ای حضوری بعدی در تهران در سال ۲۰۰۶ که بعداً فهمیدم (سردار) قاسم سلیمانی، رئیس وقت نیروی قدس که در آن زمان نسبتاً ناشناخته بود، نیز در آن حضور داشته، رضایی گفت که این «زمان طلایی برای آمریکایی‌ها» است تا اختلافات خود با ایران را حل کنند.
          - paragraph [ref=e183]:
            - strong [ref=e184]: اما او هشدار داد که اگر آمریکا «تصمیم به اقدامات سخت‌گیرانه بگیرد، یک شبه همه چیز تغییر خواهد کرد و مشکلات جدی» برای آمریکا به وجود خواهد آمد.
          - paragraph [ref=e185]: من ساده‌اندیش نیستم و حتی در آن زمان نیز می‌دانستم که شانس یک سیستم مبتنی بر طرد آمریکا - و حمایت از بازیگران متعدد ضدآمریکایی و ضداسرائیلی - برای انجام یک چرخش ۱۸۰ درجه‌ای چندان زیاد نیست.
          - paragraph [ref=e186]: اما دولت بوش در دورهٔ دوم خود - با توجه به اینکه جنگ عراق به باتلاقی تبدیل شده بود که تا حدی به دلیل حمایت ایران از حملات به نیرو‌های آمریکایی بود - هوشمندانه تصمیم گرفت علیه نظام بسیار بزرگ‌تر و ریشه‌دارتر در ایران اعلام جنگ نکند.
          - paragraph [ref=e187]: باراک اوباما این محاسبه را انجام داد که دیپلماسی و یک توافق هسته‌ای می‌تواند زمان بخرد تا ایران خود به خود تغییر کند، چرا که جمهوری اسلامی مجبور بود با جمعیتی روزافزون و عمدتاً جوان، تحصیل‌کرده و غرب‌گرا دست و پنجه نرم کند.
          - paragraph [ref=e188]: دونالد ترامپ تصمیم دیگری گرفت. در دورهٔ اول ریاست‌جمهوری خود، از برجام خارج شد، تحریم‌های «حداکثر فشار» را مجدداً اعمال کرد و با یک پهپاد، سلیمانی را هنگام ورود به فرودگاه بغداد به شهادت رساند.
          - paragraph [ref=e189]: در دورهٔ دوم ریاست‌جمهوری خود، ترامپ دو بار با ایران به جنگ رفته است - هر دو بار در میانهٔ مذاکرات. جنگ اول کوتاه و موفق بود و آسیب جدی به تأسیسات هسته‌ای ایران وارد کرد. جنگ دوم تا کنون برای ایرانی‌ها، منطقه، و مصرف‌کنندگان تحت فشار در آمریکا و سراسر جهان، شکست‌آمیز بوده است.
          - paragraph [ref=e190]: آمریکا پس از ۱۱ سپتامبر یک انتخاب داشت - اینکه القاعده را تعقیب کند یا به جنگ با تمام تروریسم با دامنهٔ جهانی برود.
          - paragraph [ref=e191]: تصمیم آن برای پذیرش مسیر دوم به فاجعه در عراق انجامید. تصمیم ترامپ برای رویارویی با جمهوری اسلامی تا کنون بدبختی بیشتری به بار آورده و تندروترین تندرو‌ها را در ایران جسورتر کرده است.
          - paragraph [ref=e192]: تا زمان نگارش این متن، نه او و نه رهبران ایران به نظر نمی‌رسند قادر به یافتن راهی برای خروج از جنگی باشند که وجهه‌ٔ خود را حفظ کند، در حالی که اگر دیپلماسی دو دهه پیش پیروز می‌شد، شاید از آن اجتناب شده بود.
